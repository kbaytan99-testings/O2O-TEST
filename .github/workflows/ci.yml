name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: Tests & Code Quality
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, xml, ctype, iconv, intl, redis
          coverage: xdebug
      
      - name: Validate composer.json
        run: composer validate --strict
      
      - name: Cache Composer packages
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      
      - name: Run PHPUnit tests
        run: php vendor/bin/phpunit --coverage-text
      
      - name: Run Behat tests
        run: php vendor/bin/behat
      
      - name: Check PSR-2 compliance
        run: php vendor/bin/phpcs
      
      - name: Run PHPStan (if configured)
        run: |
          if [ -f phpstan.neon ]; then
            composer require --dev phpstan/phpstan
            vendor/bin/phpstan analyse src --level=5
          fi
        continue-on-error: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          load: true
          tags: books-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker container
        run: |
          docker run -d -p 8000:8000 --name books-api books-api:latest
          sleep 5
          curl --fail http://localhost:8000/api/books?search=test || exit 1
          docker stop books-api
